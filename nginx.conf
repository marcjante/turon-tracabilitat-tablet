server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/manifest+json webmanifest;
    }

    # El service worker i l'HTML mai s'han de quedar en caché del
    # navegador: si no, un dispositiu podria quedar-se indefinidament
    # amb una versió antiga sense saber-ho (veure src/pwa.js).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Els fitxers dins /assets/ porten un hash de Vite al nom: són
    # immutables, es poden cachejar de forma agressiva.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
